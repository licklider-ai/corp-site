<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc">
<title id="title">Three groups. Three different questions.</title>
<desc id="desc">An overall question concerns equality of all three population means. A control comparison joins A to B and A to C. All-pairs comparisons also join B to C. The diagram shows requested questions, not results.</desc>
<rect width="1440" height="810" fill="#f5f5f3"/>
<g fill="#091726" font-family="Georgia, serif">
<text x="72" y="110" font-size="54">Three groups. Three different questions.</text>
</g>
<path d="M72 155H1368" stroke="#bcc0c4"/>
<g font-family="Arial, sans-serif" fill="#091726">

<rect x="72" y="200" width="408" height="470" rx="8" fill="white" stroke="#d8dbde"/>
<text x="100" y="260" font-size="36">Overall</text>

<rect x="99" y="320" width="354" height="225" rx="30" fill="#f5f5f3" stroke="#646970" stroke-dasharray="8 8" stroke-width="2"/>
<circle cx="276" cy="358" r="34" fill="white" stroke="#091726" stroke-width="3"/><text x="276" y="370" text-anchor="middle" font-size="36">A</text>
<circle cx="170" cy="505" r="34" fill="white" stroke="#091726" stroke-width="3"/><text x="170" y="517" text-anchor="middle" font-size="36">B</text>
<circle cx="382" cy="505" r="34" fill="white" stroke="#091726" stroke-width="3"/><text x="382" y="517" text-anchor="middle" font-size="36">C</text>
<text x="276" y="613" text-anchor="middle" font-size="26">Are all means equal?</text>
<rect x="516" y="200" width="408" height="470" rx="8" fill="white" stroke="#d8dbde"/>
<text x="544" y="260" font-size="36">Control</text>

<path d="M720 358L614 505 M720 358L826 505" fill="none" stroke="#294f78" stroke-width="5"/>
<circle cx="720" cy="358" r="34" fill="white" stroke="#091726" stroke-width="3"/><text x="720" y="370" text-anchor="middle" font-size="36">A</text>
<circle cx="614" cy="505" r="34" fill="white" stroke="#091726" stroke-width="3"/><text x="614" y="517" text-anchor="middle" font-size="36">B</text>
<circle cx="826" cy="505" r="34" fill="white" stroke="#091726" stroke-width="3"/><text x="826" y="517" text-anchor="middle" font-size="36">C</text>
<text x="720" y="613" text-anchor="middle" font-size="26">B vs A · C vs A</text>
<rect x="960" y="200" width="408" height="470" rx="8" fill="white" stroke="#d8dbde"/>
<text x="988" y="260" font-size="36">All pairs</text>

<path d="M1164 358L1058 505 M1164 358L1270 505 M1058 505H1270" fill="none" stroke="#294f78" stroke-width="5"/>
<circle cx="1164" cy="358" r="34" fill="white" stroke="#091726" stroke-width="3"/><text x="1164" y="370" text-anchor="middle" font-size="36">A</text>
<circle cx="1058" cy="505" r="34" fill="white" stroke="#091726" stroke-width="3"/><text x="1058" y="517" text-anchor="middle" font-size="36">B</text>
<circle cx="1270" cy="505" r="34" fill="white" stroke="#091726" stroke-width="3"/><text x="1270" y="517" text-anchor="middle" font-size="36">C</text>
<text x="1164" y="613" text-anchor="middle" font-size="26">A vs B · A vs C · B vs C</text>
<text x="72" y="748" font-size="25" fill="#45484c">Choose the question before the procedure.</text>
<text x="1368" y="748" text-anchor="end" font-family="Georgia, serif" font-size="27">Licklider</text>
</g></svg>
